openapi: 3.0.3
info:
  title: Spawn Timer Bot API
  description: |
    API for spawn timer character resources and DKP item lookups.

    Character endpoints upload/retrieve EverQuest inventory and spellbook files
    (`{CharacterName}-Inventory.txt`, `{CharacterName}-Spellbook.txt`).

    DKP endpoints search items in the alfred bot database and return DKP amounts
    spent on each match.
  version: 1.1.0

servers:
  - url: /
    description: Current host

security:
  - ApiKeyAuth: []

tags:
  - name: Characters
    description: Character inventory and spellbook resources
  - name: DKP Items
    description: Search EverQuest items and DKP amounts spent on them

paths:
  /api/dkp/items:
    get:
      tags: [DKP Items]
      summary: Look up an item and its DKP awards
      description: |
        Requires an exact item name match (case-insensitive). Backticks (`) and
        apostrophes (') are treated as interchangeable.

        If the query is not an exact unique match and similar item names are found,
        returns HTTP 409 with those variations so the client can refine the query.
      operationId: searchDkpItems
      parameters:
        - name: q
          in: query
          required: true
          description: Exact item name
          schema:
            type: string
            minLength: 1
          example: Belt of the Destroyer
      responses:
        "200":
          description: Exact item match with DKP award history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DkpItemSearchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No item found for the query
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DkpItemLookupError"
        "409":
          description: Query was not an exact unique match; suggested variations listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DkpItemLookupError"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /api/characters/inventory:
    get:
      tags: [Characters]
      summary: List all character inventories
      description: Returns every character that has inventory data stored, including the full file contents.
      operationId: listCharacterInventories
      responses:
        "200":
          description: All character inventories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceIndexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /api/characters/spellbook:
    get:
      tags: [Characters]
      summary: List all character spellbooks
      description: Returns every character that has spellbook data stored, including the full file contents.
      operationId: listCharacterSpellbooks
      responses:
        "200":
          description: All character spellbooks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceIndexResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /api/characters/{name}/inventory:
    parameters:
      - $ref: "#/components/parameters/CharacterName"
    get:
      tags: [Characters]
      summary: Get character inventory
      description: Returns the raw inventory file for the character as tab-separated text.
      operationId: getCharacterInventory
      responses:
        "200":
          description: Inventory file contents
          content:
            text/plain:
              schema:
                type: string
              example: |
                Location	Name	ID	Count	Slots
                Charm	Empty	0	0	0
                Head	Runed Cowl	10141	1	5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
    post:
      tags: [Characters]
      summary: Upload character inventory
      description: |
        Uploads or overwrites the inventory file for the character.

        Accepts either:
        - Raw file content in the request body (`text/plain`)
        - A file upload via `multipart/form-data` using a `file` field
      operationId: uploadCharacterInventory
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: |
              Location	Name	ID	Count	Slots
              Charm	Empty	0	0	0
              Head	Runed Cowl	10141	1	5
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Inventory file to upload
      responses:
        "200":
          description: Upload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"

  /api/characters/{name}/spellbook:
    parameters:
      - $ref: "#/components/parameters/CharacterName"
    get:
      tags: [Characters]
      summary: Get character spellbook
      description: Returns the raw spellbook file for the character as tab-separated text.
      operationId: getCharacterSpellbook
      responses:
        "200":
          description: Spellbook file contents
          content:
            text/plain:
              schema:
                type: string
              example: |
                20	Elemental Shield
                4	Gate
                24	Major Shielding
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/NotConfigured"
    post:
      tags: [Characters]
      summary: Upload character spellbook
      description: |
        Uploads or overwrites the spellbook file for the character.

        Accepts either:
        - Raw file content in the request body (`text/plain`)
        - A file upload via `multipart/form-data` using a `file` field
      operationId: uploadCharacterSpellbook
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
            example: |
              20	Elemental Shield
              4	Gate
              24	Major Shielding
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Spellbook file to upload
      responses:
        "200":
          description: Upload succeeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/NotConfigured"

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: |
        API key configured via the `CHARACTER_API_KEY` environment variable.
        May also be passed as the `api_key` query parameter.

  parameters:
    CharacterName:
      name: name
      in: path
      required: true
      description: EverQuest character name (letters, numbers, underscores, hyphens).
      schema:
        type: string
        pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
      example: Aftershock

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: Invalid or missing API key

    UploadResponse:
      type: object
      required: [character, resource, filename, updated_at]
      properties:
        character:
          type: string
          example: Aftershock
        resource:
          type: string
          enum: [inventory, spellbook]
          example: inventory
        filename:
          type: string
          description: Conventional EverQuest filename for the resource.
          example: Aftershock-Inventory.txt
        updated_at:
          type: string
          format: date-time
          example: "2026-07-01T13:21:45-04:00"

    ResourceIndexEntry:
      type: object
      required: [character, filename, updated_at, data]
      properties:
        character:
          type: string
          example: Aftershock
        filename:
          type: string
          example: Aftershock-Inventory.txt
        updated_at:
          type: string
          format: date-time
          example: "2026-07-01T13:21:45-04:00"
        data:
          type: string
          description: Raw tab-separated file contents.
          example: |
            Location	Name	ID	Count	Slots
            Charm	Empty	0	0	0

    ResourceIndexResponse:
      type: object
      required: [resource, characters]
      properties:
        resource:
          type: string
          enum: [inventory, spellbook]
          example: inventory
        characters:
          type: array
          items:
            $ref: "#/components/schemas/ResourceIndexEntry"

    DkpItemSearchResponse:
      type: object
      required: [query, item]
      properties:
        query:
          type: string
          example: Belt of the Destroyer
        item:
          $ref: "#/components/schemas/DkpItemResult"

    DkpItemLookupError:
      type: object
      required: [error, query, matches]
      properties:
        error:
          type: string
          example: No exact unique item match; refine your query. Found 3 variation(s).
        query:
          type: string
          example: Belt of
        matches:
          type: array
          items:
            type: string
          example:
            - Belt of Fire
            - Belt of the Destroyer
            - Belt of Tranquility

    DkpItemResult:
      type: object
      required: [id, name, summary, awards]
      properties:
        id:
          type: integer
          example: 6692
        name:
          type: string
          example: Belt of the Destroyer
        summary:
          $ref: "#/components/schemas/DkpItemSummary"
        awards:
          type: array
          items:
            $ref: "#/components/schemas/DkpItemAward"

    DkpItemSummary:
      type: object
      required: [times_awarded, total_dkp]
      properties:
        times_awarded:
          type: integer
          example: 27
        total_dkp:
          type: integer
          example: 16093
        average_dkp:
          type: number
          nullable: true
          example: 596.04
        min_dkp:
          type: integer
          nullable: true
          example: 1
        max_dkp:
          type: integer
          nullable: true
          example: 1470

    DkpItemAward:
      type: object
      required: [id, dkp]
      properties:
        id:
          type: integer
        dkp:
          type: integer
          example: 1470
        awarded_at:
          type: string
          format: date-time
          nullable: true
        character:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DkpCharacterRef"
        event:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/DkpEventRef"

    DkpCharacterRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Bulki
        class:
          type: string
          nullable: true
          example: Myrmidon

    DkpEventRef:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          example: Dagarn the Destroyer
        target:
          nullable: true
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
              example: Dagarn the Destroyer

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Character or file not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotConfigured:
      description: CHARACTER_API_KEY is not configured
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
